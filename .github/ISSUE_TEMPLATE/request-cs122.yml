name: Request a CS122 repo
description: Get your personal repo for a CS122 assignment. Register first if you have not.
title: "request-cs122: "
body:
  - type: markdown
    attributes:
      value: |
        ### Request your CS122 assignment repo
        Pick the assignment. Your GitHub username is captured automatically.
        Not registered yet? Open the **Register** form first.
  - type: dropdown
    id: assignment
    attributes:
      label: Assignment
      description: (Auto-generated from config.json — do not hand-edit.)
      options:
        - A00
        - L21
        - L22
        - L23
        - L24
        - W25
    validations:
      required: true
