name: Request a CS130 repo
description: Get your personal repo for a CS130 assignment. Register first if you have not.
title: "request-cs130: "
body:
  - type: markdown
    attributes:
      value: |
        ### Request your CS130 assignment repo
        Pick the assignment. Your GitHub username is captured automatically.
        Not registered yet? Open the **Register** form first.
  - type: dropdown
    id: assignment
    attributes:
      label: Assignment
      description: (Auto-generated from config.json — do not hand-edit.)
      options:
        - A00
        - A17
        - L20
        - L21
        - L22
        - L31
        - L32
        - L33
        - L134
        - M1Q1
        - W6A1
        - W6L01
        - W6L1
        - W6L02
        - W6L2
        - W7A1
        - W7L1
        - W7L2
        - W8A1
        - W8A2
        - W8A3
        - W8L0
        - W8L1
    validations:
      required: true
  - type: input
    id: access_code
    attributes:
      label: Access code
      description: Quizzes and exams ONLY — leave this blank for regular assignments. The code is inside the quiz on Canvas.
    validations:
      required: false
