name: Request a CS140 repo
description: Get your personal repo for a CS140 assignment. Register first if you have not.
title: "request-cs140: "
body:
  - type: markdown
    attributes:
      value: |
        ### Request your CS140 assignment repo
        Pick the assignment. Your GitHub username is captured automatically.
        Not registered yet? Open the **Register** form first.
  - type: dropdown
    id: assignment
    attributes:
      label: Assignment
      description: (Auto-generated from config.json — do not hand-edit.)
      options:
        - A00
    validations:
      required: true
